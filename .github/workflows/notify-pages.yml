# The site is built and served from olaysco/olaysco.github.io, which checks
# this repo out at master. A workflow only sees push events from its own repo,
# so that one cannot watch this one — it otherwise waits for its daily cron.
# This ping closes the gap: a push to master rebuilds the site immediately.
name: Notify Pages site

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      # GITHUB_TOKEN is scoped to this repo only, so reaching the Pages repo
      # needs a PAT with contents: write on olaysco.github.io.
      - name: Request a rebuild of olaysco.github.io
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/olaysco/olaysco.github.io/dispatches \
            -d '{"event_type":"portfolio-updated"}'
        env:
          TOKEN: ${{ secrets.PAGES_DISPATCH_TOKEN }}
